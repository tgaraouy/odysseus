services:
  odysseus:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ./data:/app/data:z
      - ./logs:/app/logs:z
      # Cookbook remote-server SSH identity. Odysseus can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ./data/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Odysseus
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ./data/huggingface:/app/.cache/huggingface:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the odysseus user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ./data/local:/app/.local:z
      # Tier-B sandbox IPC: the runner's Unix socket lives here, shared with the
      # sandbox container. The app dispatches bash/python over it.
      - sandbox-ipc:/app/sandbox-ipc
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      # Session cookies marked Secure (you reach the app over HTTPS via Tailscale;
      # browsers also treat http://localhost as a secure context). Override to
      # false in .env only if you must use a plain-HTTP origin.
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Tier-B: dispatch the agent's bash/python into the isolated sandbox runner.
      # Unset to fall back to in-container (Tier-A-hardened) local execution.
      - SANDBOX_RUNNER_SOCK=${SANDBOX_RUNNER_SOCK:-/app/sandbox-ipc/runner.sock}
      - SANDBOX_FALLBACK_LOCAL=${SANDBOX_FALLBACK_LOCAL:-false}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
      sandbox:
        condition: service_started
    restart: unless-stopped

  # Tier-B bash/python sandbox runner. Executes the agent's shell/python tool
  # calls in hard isolation: NO network, read-only rootfs, tmpfs scratch, all
  # capabilities dropped, no-new-privileges, and NO data/secret/.ssh mounts — so
  # a prompt-injection that reaches the shell cannot exfiltrate, reach internal
  # services / the ToufHealth bridge, or read the data volume. App↔runner IPC is
  # a Unix socket on the shared sandbox-ipc volume (works with no network).
  # See docs/security/bash-python-sandbox-scoping.md (Tier B).
  sandbox:
    build: ./docker/sandbox
    network_mode: "none"
    read_only: true
    tmpfs:
      - /work:size=512m,mode=1777
      - /tmp:size=64m,mode=1777
    volumes:
      - sandbox-ipc:/ipc
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped

  chromadb:
    # Pinned by digest (NOT :latest) — a `latest` roll to 1.0.0 caused a
    # client/server skew ('_type' KeyError) that broke Odysseus RAG/memory.
    # Bump deliberately after verifying the client (requirements: chromadb-client)
    # is compatible. This digest = the 1.x server the host gold-tier already uses.
    image: docker.io/chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — odysseus waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # MyOwnHealth health bridge — the user's local health record exposed to the
  # agent as MCP tools (FastMCP, Streamable HTTP at :8770) plus the 3 timers
  # (projection / weekly-query / apollo) via supercronic. Containerizing it means
  # ONE `docker compose up -d` runs the bridge on macOS OR Windows — no launchd,
  # no systemd, no WSL Ubuntu. The bridge code is a SEPARATE repo (MyOwnHealth),
  # so the build context is BRIDGE_REPO (set by scripts/provision.sh).
  #
  # OFF by default (profile "bridge"). Enable per-install with COMPOSE_PROFILES=
  # bridge in .env. The live Mac runs the bridge under launchd, so it leaves this
  # profile UNSET and `docker compose up -d` ignores this service entirely —
  # nothing here can collide with the launchd bridge on :8770.
  #
  # Runs as root (image default): first-party code that must write the shared
  # ledger + the generated /health,/ledger HTML into the app's data volume and
  # the gold tier in ChromaDB. Unlike the `sandbox` service it is NOT isolated —
  # it is the trusted health backend, not an untrusted-code runner.
  bridge:
    profiles: ["bridge"]
    build:
      context: ${BRIDGE_REPO:-../../myownhealth}
      dockerfile: mcp/Dockerfile
    extra_hosts:
      # Reach the host's Ollama (on-demand FTE-analysis tools) the same way the
      # app does, on both Docker Desktops.
      - "host.docker.internal:host-gateway"
    environment:
      # Listen on all interfaces INSIDE the container; the port is NOT published
      # to the host, so the bridge stays reachable only on the compose network
      # (off the LAN, preserving the host-bridge posture). The app connects to
      # http://bridge:8770/mcp, so allowlist that Host for the bridge's
      # DNS-rebinding protection.
      - HEALTH_MCP_HOST=0.0.0.0
      - HEALTH_MCP_PORT=8770
      - HEALTH_MCP_ALLOWED_HOSTS=bridge:8770
      # Shared gold tier — the SAME ChromaDB the app uses (compose-network DNS).
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # apollo reminders -> the ntfy service on the compose network.
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=${NTFY_TOPIC:-Reminders}
      - BRIDGE_OLLAMA_URL=${BRIDGE_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_URL=${BRIDGE_OLLAMA_URL:-http://host.docker.internal:11434}
      # Ledger + the generated /health and /ledger pages live in the app's data
      # volume (mounted at /odyssey-data below) so the app serves them as-is.
      - LEDGER_DB=/odyssey-data/ledger/health.ledger.db
      - HEALTH_HUB_OUT=/odyssey-data/health-hub.html
      - LEDGER_VIEW_OUT=/odyssey-data/health-ledger.html
      # MyOwnHealth's own record + WHOOP tokens + the fastembed model cache
      # persist on a named volume (survive container rebuilds).
      - MYOWNHEALTH_DB=/app/data/user/longevity_os.db
      - WHOOP_TOKENS=/app/data/user/.whoop_tokens.json
      - HF_HOME=/app/data/user/.cache/hf
      - FASTEMBED_CACHE_PATH=/app/data/user/.cache/fastembed
      # WHOOP app credentials (optional). Written to .env by provision.sh when
      # configured; blank otherwise (the bridge runs fine without wearable sync).
      - WHOOP_CLIENT_ID=${WHOOP_CLIENT_ID:-}
      - WHOOP_CLIENT_SECRET=${WHOOP_CLIENT_SECRET:-}
      - WHOOP_REDIRECT_URI=${WHOOP_REDIRECT_URI:-http://localhost:${APP_PORT:-7000}/whoop/callback}
    volumes:
      - ./data:/odyssey-data:z
      - myownhealth-data:/app/data/user
    depends_on:
      chromadb:
        condition: service_started
      ntfy:
        condition: service_started
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  sandbox-ipc:
  myownhealth-data:
