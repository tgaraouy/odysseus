<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — Mohtasib</title>
<link rel="icon" type="image/svg+xml" href="/static/icon-192.png">
<style>
:root{
  --bg:#141210;--panel:#1C1A14;--panel-2:#252118;--line:#37332A;
  --fg:#F4F0E6;--fg-2:#C9C2B1;--fg-3:#8A8373;--seal:#C65A52;--seal-solid:#9E2B25;
  --crit:#C65A52;--maj:#D9A94E;--min:#8A8373;
  --measured:#7FBF97;--observed:#8FB4DE;--inferred:#D9A94E;--claimed:#A79E8C;
  --serif:'Source Serif 4',Georgia,serif;--sans:Inter,-apple-system,sans-serif;--mono:'JetBrains Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
/* sidebar */
.side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.wm{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:-.03em}.wm .v{color:var(--fg-3)}
.ar{font-family:var(--serif);font-size:15px;color:var(--fg-3)}
.role-badge{font-family:var(--mono);font-size:10px;color:var(--observed);background:rgba(143,180,222,.14);border-radius:999px;padding:3px 8px;display:inline-block;margin:10px 0 16px}
nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;color:var(--fg-2);text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--panel-2)}
nav a.on{background:rgba(198,90,82,.14);color:var(--fg);font-weight:500}
nav a .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.side-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot a{font-family:var(--mono);font-size:12px;color:var(--observed);text-decoration:none}
/* main */
main{flex:1;padding:30px 34px 80px;max-width:1000px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;margin:.15em 0 .4em}
h2{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px 16px}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.tile .v{font-family:var(--serif);font-size:30px;margin-top:6px}
.tile .v.crit{color:var(--crit)}.tile .v.maj{color:var(--maj)}
.flag{border:1px solid var(--line);border-radius:7px;margin:11px 0;background:var(--panel);overflow:hidden}
.flag-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:13.5px}
.glyph{font-size:11px}.sev-critique .glyph{color:var(--crit)}.sev-majeur .glyph{color:var(--maj)}.sev-mineur .glyph{color:var(--min)}
.pill{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg-3)}
.pill.pending{color:var(--inferred);border-color:rgba(217,169,78,.4)}
.conf{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.flag-b{padding:11px 14px;display:grid;gap:5px;font-size:13px;color:var(--fg-2)}
.flag-b .cle{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);display:inline-block;min-width:74px;margin-right:8px}
.mono{font-family:var(--mono)}
.masked{color:var(--inferred);background:rgba(217,169,78,.1);border:1px solid rgba(217,169,78,.3);border-radius:7px;padding:14px 16px;font-size:13.5px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:14px}
.metric{background:var(--panel);padding:12px 14px}
.metric .mk{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.metric .mv{font-family:var(--serif);font-size:19px;margin:5px 0 3px}
.metric .md{font-size:12px;color:var(--fg-3);line-height:1.4}
.jrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.jrow .t{font-family:var(--mono);color:var(--observed);min-width:120px}
.jrow .h{font-family:var(--mono);color:var(--fg-3);font-size:11px}
.ok-badge{font-family:var(--mono);font-size:12px;color:var(--measured)}
.note{color:var(--fg-3);font-size:13px;margin-top:8px}
.empty{color:var(--fg-3);margin-top:40px}
.confp{padding:1px 6px;border-radius:3px;font-size:10px;font-family:var(--mono)}
.MEASURED{background:rgba(127,191,151,.16);color:var(--measured)}.OBSERVED{background:rgba(143,180,222,.16);color:var(--observed)}
.INFERRED{background:rgba(217,169,78,.16);color:var(--inferred)}.CLAIMED{background:rgba(167,158,140,.16);color:var(--claimed)}
</style></head>
<body>
<aside class="side">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2.4 2.15"/><path d="M16 5.2 L18.9 13.1 L26.8 16 L18.9 18.9 L16 26.8 L13.1 18.9 L5.2 16 L13.1 13.1 Z" fill="currentColor"/><circle cx="16" cy="16" r="2" fill="#9E2B25"/></svg>
    <span class="wm">mohtasib<span class="v">/cdc</span></span>
  </div>
  <span class="ar">المحتسب · contrôle de la commande publique</span>
  <div id="role-badge" class="role-badge">…</div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <a href="/mohtasib/roles">⚙ Attribution des rôles</a>
    <a href="/agent">← application (agent)</a>
  </div>
</aside>
<main id="main"><p class="empty">Chargement…</p></main>

<script>
const SECTIONS = [
  {id:'dashboard',   label:'Tableau de bord'},
  {id:'signalements',label:'Signalements'},
  {id:'validation',  label:'Validation'},
  {id:'ethique',     label:'Éthique & probité'},
  {id:'metriques',   label:'Métriques'},
  {id:'journal',     label:'Journal & assurance'},
];
const GLY={critique:'▲',majeur:'◆',mineur:'•'};
let D=null, active='dashboard';

async function boot(){
  let r;
  try{ r=await fetch('/api/mohtasib/overview',{credentials:'same-origin'}); }
  catch(e){ document.getElementById('main').innerHTML='<p class="empty">Erreur réseau.</p>'; return; }
  if(r.status===401){ location.href='/login'; return; }
  if(!r.ok){ document.getElementById('main').innerHTML='<p class="empty">Accès refusé.</p>'; return; }
  D=await r.json();
  document.getElementById('role-badge').textContent = (D.roles&&D.roles.length)? D.roles.join(' · ') : 'aucun rôle — accès nul';
  const shown = SECTIONS.filter(s=>D[s.id]!=null);
  document.getElementById('nav').innerHTML = shown.map(s=>{
    let n=''; if(s.id==='signalements'&&D.dashboard) n=D.dashboard.n_signalements;
    if(s.id==='validation'&&D.validation) n=(D.validation.file||[]).length;
    return `<a data-s="${s.id}">${s.label}${n!==''?`<span class="n">${n}</span>`:''}</a>`;
  }).join('') || '<p class="note" style="padding:8px">Aucune section — votre rôle ne donne accès à rien.</p>';
  document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.s));
  if(shown.length) go(shown[0].id); else document.getElementById('main').innerHTML='<p class="empty">Aucun accès.</p>';
}
function go(id){ active=id; document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.s===id)); render(); }

function render(){
  const m=document.getElementById('main');
  const R={dashboard:dash,signalements:sig,validation:val,ethique:eth,metriques:met,journal:jour}[active];
  m.innerHTML = R? R() : '<p class="empty">—</p>';
}
function head(eb,h){ return `<div class="eyebrow">${eb}</div><h1>${h}</h1>`; }

function dash(){
  const d=D.dashboard; if(!d) return '<p class="empty">Accès restreint.</p>';
  return head('vue d’ensemble','Tableau de bord')+`
  <div class="tiles">
    <div class="tile"><div class="k">Marchés contrôlés</div><div class="v">${d.n_tenders}</div></div>
    <div class="tile"><div class="k">Signalements</div><div class="v">${d.n_signalements}</div></div>
    <div class="tile"><div class="k">Critiques</div><div class="v crit">${d.par_severite.critique}</div></div>
    <div class="tile"><div class="k">Majeurs</div><div class="v maj">${d.par_severite.majeur}</div></div>
    <div class="tile"><div class="k">En attente de validation</div><div class="v">${d.en_attente_validation}</div></div>
  </div>
  <p class="note">Couverture exhaustive du périmètre ingéré (pas d’échantillon). Un signalement reste
  <span class="mono">pending</span> jusqu’à validation d’un magistrat.</p>`;
}
function flagCard(f){
  const conf = (f.source&&(f.source.includes('LLM')||f.source.includes('sémantique')))?'INFERRED'
    : (f.source&&f.source.includes('heuristique'))?'CLAIMED':'OBSERVED';
  return `<div class="flag sev-${f.severite}"><div class="flag-h">
    <span class="glyph">${GLY[f.severite]||'•'}</span>
    <span class="mono">[${f.controle}]</span><strong>${f.titre}</strong>
    <span class="pill pending">${f.statut}</span>
    <span class="confp ${conf}">${conf}</span>
    <span class="conf">conf. ${(f.confiance||0).toFixed?f.confiance.toFixed(2):f.confiance}</span>
  </div><div class="flag-b">
    <div><span class="cle">marché</span>${f.tender||'—'}</div>
    <div><span class="cle">attendu</span>${f.attendu||'—'}</div>
    <div><span class="cle">observé</span>${f.observe||'—'}</div>
    <div><span class="cle">source</span>${f.source||'—'}</div>
    <div><span class="cle">base</span>${f.base||'—'}</div>
  </div></div>`;
}
function sig(){
  const s=D.signalements;
  if(s&&s.masque) return head('contrôles','Signalements')+`<div class="masked">Accès restreint à votre rôle : <b>${s.n}</b> signalement(s) existent, contenu masqué.</div>`;
  if(!s||!s.length) return head('contrôles','Signalements')+'<p class="empty">Aucun signalement.</p>';
  const ord={critique:0,majeur:1,mineur:2};
  return head('contrôles · triés par risque','Signalements')+[...s].sort((a,b)=>ord[a.severite]-ord[b.severite]).map(flagCard).join('');
}
function val(){
  const v=D.validation; if(!v) return '<p class="empty">Accès restreint.</p>';
  const f=v.file||[];
  return head('humain dans la boucle','Validation → constat')+
    `<p class="note">${v.peut_valider?'Vous pouvez promouvoir un signalement en constat (autorité magistrat).':'Consultation seule — la validation est réservée au magistrat rapporteur.'}</p>`+
    (f.length?f.map(flagCard).join(''):'<p class="empty">File vide.</p>');
}
function eth(){
  const e=D.ethique;
  if(e&&e.masque) return head('éthique','Éthique & probité')+`<div class="masked">Accès restreint : <b>${e.n}</b> alerte(s) de probité existent, contenu réservé au responsable éthique.</div>`;
  if(!e||!e.length) return head('éthique','Éthique & probité')+'<p class="note">Aucune alerte de probité (DOP / conflits) sur les contrôles exécutés.</p>';
  return head('éthique · DOP / conflits','Éthique & probité')+e.map(flagCard).join('');
}
function met(){
  const m=D.metriques; if(!m) return '<p class="empty">Accès restreint.</p>';
  const groups=[['performance','Performance'],['accuracy','Exactitude'],['reliability','Fiabilité'],['drift_predictability','Dérive'],['security','Sécurité'],['assurance','Assurance']];
  let html=head('mesuré · sur données réelles','Métriques');
  for(const [k,label] of groups){ const g=m[k]; if(!g) continue;
    const items=Object.entries(g).filter(([kk])=>kk!=='source'&&!kk.startsWith('_')).slice(0,6);
    html+=`<h2 style="margin-top:22px">${label} <span class="confp ${g.source||''}" style="font-size:9px">${g.source||''}</span></h2><div class="metric-grid">`+
      items.map(([kk,vv])=>`<div class="metric"><div class="mk">${kk.replace(/_/g,' ')}</div><div class="mv">${typeof vv==='object'?(vv.valeur??vv.mediane??JSON.stringify(vv).slice(0,40)):vv}</div><div class="md">${typeof vv==='object'?(vv.detail||vv.src||''):''}</div></div>`).join('')+`</div>`;
  }
  return html;
}
function jour(){
  const j=D.journal; if(!j) return '<p class="empty">Accès restreint.</p>';
  if(j.erreur) return head('assurance','Journal de preuve')+`<p class="empty">${j.erreur}</p>`;
  return head('assurance · chaîne de hachage','Journal de preuve')+`
    <div class="tiles"><div class="tile"><div class="k">Hauteur de chaîne</div><div class="v">${j.hauteur}</div></div>
    <div class="tile"><div class="k">Intégrité</div><div class="v" style="font-size:20px">${j.verifiee?'<span class="ok-badge">vérifiée ✓</span>':'ROMPUE ✗'}</div></div></div>
    <h2 style="margin-top:20px">Blocs par type</h2>
    <div class="metric-grid">${Object.entries(j.par_type).map(([t,n])=>`<div class="metric"><div class="mk">${t}</div><div class="mv">${n}</div></div>`).join('')}</div>
    <h2 style="margin-top:22px">Blocs récents</h2>
    ${j.recents.map(b=>`<div class="jrow"><span class="t">${b.type}</span><span class="h">${b.hash10}</span><span>${(b.confiance||'—')}</span><span class="h">${b.ts}</span></div>`).join('')}`;
}
boot();
</script>
</body></html>
