<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — Mohtasib</title>
<link rel="icon" type="image/svg+xml" href="/static/icon-192.png">
<style>
:root{
  --bg:#141210;--panel:#1C1A14;--panel-2:#252118;--line:#37332A;
  --fg:#F4F0E6;--fg-2:#C9C2B1;--fg-3:#8A8373;--seal:#C65A52;--seal-solid:#9E2B25;
  --crit:#C65A52;--maj:#D9A94E;--min:#8A8373;
  --measured:#7FBF97;--observed:#8FB4DE;--inferred:#D9A94E;--claimed:#A79E8C;
  --serif:'Source Serif 4',Georgia,serif;--sans:Inter,-apple-system,sans-serif;--mono:'JetBrains Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
/* sidebar */
.side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.wm{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:-.03em}.wm .v{color:var(--fg-3)}
.ar{font-family:var(--serif);font-size:15px;color:var(--fg-3)}
.role-badge{font-family:var(--mono);font-size:10px;color:var(--observed);background:rgba(143,180,222,.14);border-radius:999px;padding:3px 8px;display:inline-block;margin:10px 0 16px}
nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;color:var(--fg-2);text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--panel-2)}
nav a.on{background:rgba(198,90,82,.14);color:var(--fg);font-weight:500}
nav a .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.side-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot a{font-family:var(--mono);font-size:12px;color:var(--observed);text-decoration:none}
/* main */
main{flex:1;padding:30px 34px 80px;max-width:1000px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;margin:.15em 0 .4em}
h2{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px 16px}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.tile .v{font-family:var(--serif);font-size:30px;margin-top:6px}
.tile .v.crit{color:var(--crit)}.tile .v.maj{color:var(--maj)}
.flag{border:1px solid var(--line);border-radius:7px;margin:11px 0;background:var(--panel);overflow:hidden}
.flag-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:13.5px}
.glyph{font-size:11px}.sev-critique .glyph{color:var(--crit)}.sev-majeur .glyph{color:var(--maj)}.sev-mineur .glyph{color:var(--min)}
.pill{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg-3)}
.pill.pending{color:var(--inferred);border-color:rgba(217,169,78,.4)}
.conf{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.flag-b{padding:11px 14px;display:grid;gap:5px;font-size:13px;color:var(--fg-2)}
.flag-b .cle{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);display:inline-block;min-width:74px;margin-right:8px}
.mono{font-family:var(--mono)}
.masked{color:var(--inferred);background:rgba(217,169,78,.1);border:1px solid rgba(217,169,78,.3);border-radius:7px;padding:14px 16px;font-size:13.5px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:14px}
.metric{background:var(--panel);padding:12px 14px}
.metric .mk{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.metric .mv{font-family:var(--serif);font-size:19px;margin:5px 0 3px}
.metric .md{font-size:12px;color:var(--fg-3);line-height:1.4}
.jrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.jrow .t{font-family:var(--mono);color:var(--observed);min-width:120px}
.jrow .h{font-family:var(--mono);color:var(--fg-3);font-size:11px}
.ok-badge{font-family:var(--mono);font-size:12px;color:var(--measured)}
.note{color:var(--fg-3);font-size:13px;margin-top:8px}
.empty{color:var(--fg-3);margin-top:40px}
.confp{padding:1px 6px;border-radius:3px;font-size:10px;font-family:var(--mono)}
.MEASURED{background:rgba(127,191,151,.16);color:var(--measured)}.OBSERVED{background:rgba(143,180,222,.16);color:var(--observed)}
.INFERRED{background:rgba(217,169,78,.16);color:var(--inferred)}.CLAIMED{background:rgba(167,158,140,.16);color:var(--claimed)}
/* dossiers list */
.doss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:20px}
.doss-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 17px;cursor:pointer;transition:border-color .12s,transform .12s}
.doss-card:hover{border-color:var(--seal);transform:translateY(-1px)}
.doss-ref{font-size:15px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
.doss-sev{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.doss-sev.big{margin:14px 0 4px}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg-3)}
.chip.crit{color:var(--crit);border-color:rgba(198,90,82,.45)}.chip.maj{color:var(--maj);border-color:rgba(217,169,78,.4)}.chip.min{color:var(--min)}
.doss-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg-3);margin-bottom:12px}
.doss-meta .ok{color:var(--measured)}.doss-meta .off{color:var(--maj)}
.doss-open{font-family:var(--mono);font-size:12px;color:var(--observed)}
/* timeline */
.back{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--observed);text-decoration:none;cursor:pointer;margin-bottom:6px}
.timeline{list-style:none;margin:22px 0 0;padding:0}
.tl-step{position:relative;display:flex;gap:16px;padding:0 0 26px 0}
.tl-step:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:1px;background:var(--line)}
.tl-n{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--fg-2);z-index:1}
.tl-body{flex:1;min-width:0}
.tl-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tl-h b{font-family:var(--serif);font-size:18px;font-weight:500}
.tl-sub{font-size:12px;color:var(--fg-3)}
.tl-c{font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 22px}
.kv{display:flex;gap:10px;font-size:13px;color:var(--fg-2);padding:2px 0}
.kv .cle{flex:0 0 120px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.kv .h{font-size:11px;color:var(--fg-3)}
table.xt{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.xt th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:400;padding:5px 10px;border-bottom:1px solid var(--line)}
table.xt td{padding:6px 10px;border-bottom:1px solid var(--line);color:var(--fg-2);vertical-align:top}
table.xt td.cle{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--fg-3)}
table.xt td.chg{color:var(--inferred);background:rgba(217,169,78,.08)}
.rectbox{border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.rect-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:13px}
.champ{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.champ:last-child{border-bottom:none}
.champ .cle{flex:0 0 118px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.champ .av{color:var(--fg-3);text-decoration:line-through}.champ .arrow{color:var(--fg-3)}.champ .ap{color:var(--fg);font-weight:500}
.champ .statut{margin-left:auto;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--fg-3)}
.champ .statut.ok{color:var(--measured);border-color:rgba(127,191,151,.4)}
.champ .statut.warn{color:var(--crit);border-color:rgba(198,90,82,.5);background:rgba(198,90,82,.1)}
.champ .prob{font-size:11px;color:var(--crit);flex-basis:100%}
.jlist{margin-top:8px}
</style></head>
<body>
<aside class="side">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2.4 2.15"/><path d="M16 5.2 L18.9 13.1 L26.8 16 L18.9 18.9 L16 26.8 L13.1 18.9 L5.2 16 L13.1 13.1 Z" fill="currentColor"/><circle cx="16" cy="16" r="2" fill="#9E2B25"/></svg>
    <span class="wm">mohtasib<span class="v">/cdc</span></span>
  </div>
  <span class="ar">المحتسب · contrôle de la commande publique</span>
  <div id="role-badge" class="role-badge">…</div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <a href="/mohtasib/roles">⚙ Attribution des rôles</a>
    <a href="/agent">← application (agent)</a>
  </div>
</aside>
<main id="main"><p class="empty">Chargement…</p></main>

<script src="/static/js/mohtasib-console.js"></script>
</body></html>
