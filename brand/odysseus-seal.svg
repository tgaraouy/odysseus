<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Odysseus">
  <!-- sealed boundary -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#141311" stroke-width="1.25"/>
  <!-- chain of blocks / tamper-evident seal (dashes = blocks) -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#141311" stroke-width="1.1" stroke-dasharray="2.4 2.15"/>
  <!-- compass / north star: the journey + the navigating agent -->
  <path d="M16 5.2 L18.9 13.1 L26.8 16 L18.9 18.9 L16 26.8 L13.1 18.9 L5.2 16 L13.1 13.1 Z" fill="#141311"/>
  <!-- genesis: the sealed sovereign core -->
  <circle cx="16" cy="16" r="2" fill="#9E2B25"/>
</svg>
